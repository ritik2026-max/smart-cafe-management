<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    The Sky House Cafe & Restaurant
</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f5f5f5;

    color: #222;

}


/* =====================================
   HEADER
===================================== */

.header {

    background:
        linear-gradient(
            135deg,
            #ff6b00,
            #ff9800
        );

    color: white;

    text-align: center;

    padding: 25px 15px;

}


.header img {

    width: 75px;

    height: 75px;

    border-radius: 50%;

    object-fit: cover;

    background: white;

}


.header h1 {

    margin: 10px 0 5px;

    font-size: 28px;

}


.header p {

    margin: 0;

    font-size: 15px;

}


/* =====================================
   TOP BAR
===================================== */

.top-bar {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 15px;

    padding: 18px;

    background: white;

    flex-wrap: wrap;

}


#searchInput {

    width: 600px;

    max-width: 90%;

    padding: 14px 18px;

    border: 1px solid #ddd;

    border-radius: 10px;

    font-size: 15px;

}


/* =====================================
   CART BUTTON
===================================== */

.cart-btn {

    border: none;

    background: #ff6b00;

    color: white;

    padding: 13px 20px;

    border-radius: 10px;

    font-size: 16px;

    cursor: pointer;

}


.cart-btn:hover {

    background: #e85d00;

}


#cartCount {

    background: white;

    color: #ff6b00;

    padding: 2px 7px;

    border-radius: 20px;

    margin-left: 5px;

    font-weight: bold;

}


/* =====================================
   CATEGORIES
===================================== */

.categories {

    display: flex;

    justify-content: center;

    gap: 10px;

    padding: 15px;

    flex-wrap: wrap;

    background: white;

}


.category-btn {

    border: none;

    background: #ff6b00;

    color: white;

    padding: 10px 17px;

    border-radius: 25px;

    cursor: pointer;

}


.category-btn:hover {

    background: #e85d00;

}


/* =====================================
   MENU
===================================== */

.menu-container {

    width: 95%;

    max-width: 1100px;

    margin: 25px auto;

}


.menu-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(250px, 1fr)
        );

    gap: 22px;

}


/* =====================================
   FOOD CARD
===================================== */

.food-card {

    background: white;

    border-radius: 15px;

    overflow: hidden;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,0.10);

}


.food-card img {

    width: 100%;

    height: 220px;

    object-fit: cover;

}


.food-info {

    padding: 16px;

}


.food-info h3 {

    margin:
        0 0 7px;

    text-transform: capitalize;

}


.category {

    color: #777;

    font-size: 13px;

}


.price {

    color: #ff6b00;

    font-size: 20px;

    font-weight: bold;

    margin:
        10px 0;

}


.add-btn {

    width: 100%;

    border: none;

    background: #ff6b00;

    color: white;

    padding: 12px;

    border-radius: 8px;

    cursor: pointer;

    font-size: 15px;

}


.add-btn:hover {

    background: #e85d00;

}


/* =====================================
   MESSAGE
===================================== */

.message {

    text-align: center;

    padding: 40px;

    font-size: 18px;

}


/* =====================================
   MOBILE
===================================== */

@media(max-width:600px) {

    .header h1 {

        font-size: 22px;

    }

    .food-card img {

        height: 190px;

    }

}

</style>

</head>


<body>


<!-- =====================================
     HEADER
===================================== -->

<header class="header">

    <img
        src="../image/logo.png"
        alt="Sky House Cafe"
        onerror="this.style.display='none'"
    >

    <h1>
        The Sky House Cafe & Restaurant
    </h1>

    <p>
        Good Food • Good Mood • Good Times
    </p>

</header>


<!-- =====================================
     SEARCH + CART
===================================== -->

<div class="top-bar">

    <input
        type="text"
        id="searchInput"
        placeholder="Search your favourite food..."
    >


    <button
        class="cart-btn"
        onclick="location.href='cart.html'"
    >

        🛒 Cart

        <span id="cartCount">
            0
        </span>

    </button>

</div>


<!-- =====================================
     CATEGORIES
===================================== -->

<div
    class="categories"
    id="categories"
>

    <button
        class="category-btn"
        data-category="all"
    >
        All
    </button>

    <button
        class="category-btn"
        data-category="pizza"
    >
        Pizza
    </button>

    <button
        class="category-btn"
        data-category="pasta"
    >
        Pasta
    </button>

    <button
        class="category-btn"
        data-category="chinese"
    >
        Chinese
    </button>

    <button
        class="category-btn"
        data-category="momos"
    >
        Momos
    </button>

    <button
        class="category-btn"
        data-category="rice"
    >
        Rice
    </button>

    <button
        class="category-btn"
        data-category="starter"
    >
        Starter
    </button>

    <button
        class="category-btn"
        data-category="tandoor"
    >
        Tandoor
    </button>

    <button
        class="category-btn"
        data-category="main course"
    >
        Main Course
    </button>

    <button
        class="category-btn"
        data-category="north indian"
    >
        North Indian
    </button>

    <button
        class="category-btn"
        data-category="south indian"
    >
        South Indian
    </button>

    <button
        class="category-btn"
        data-category="beverages"
    >
        Beverages
    </button>

</div>


<!-- =====================================
     MENU
===================================== -->

<main class="menu-container">

    <div
        id="menuMessage"
        class="message"
    >
        Loading menu...
    </div>


    <div
        id="menuGrid"
        class="menu-grid"
    ></div>

</main>


<!-- =====================================
     JS
===================================== -->

<script
    type="module"
    src="../js/customer-menu.js"
></script>


</body>

</html>

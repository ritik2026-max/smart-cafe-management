<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Cart | Sky House Cafe
</title>


<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Arial,
        sans-serif;

    background: #f5f5f5;

}


/* =====================================
   HEADER
===================================== */

.header {

    background:
        linear-gradient(
            135deg,
            #ff6b00,
            #ff9800
        );

    color: white;

    padding: 20px;

    text-align: center;

}


.header button {

    border: none;

    padding: 10px 18px;

    border-radius: 8px;

    cursor: pointer;

}


/* =====================================
   CONTAINER
===================================== */

.container {

    width: 95%;

    max-width: 900px;

    margin: 25px auto;

}


/* =====================================
   CART ITEM
===================================== */

.cart-item {

    background: white;

    margin-bottom: 15px;

    padding: 15px;

    border-radius: 12px;

    display: flex;

    align-items: center;

    gap: 15px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,0.08);

}


.cart-item img {

    width: 90px;

    height: 90px;

    object-fit: cover;

    border-radius: 10px;

}


.item-info {

    flex: 1;

}


.item-info h3 {

    margin: 0 0 7px;

    text-transform: capitalize;

}


.item-price {

    color: #ff6b00;

    font-weight: bold;

}


/* =====================================
   QUANTITY
===================================== */

.quantity {

    display: flex;

    align-items: center;

    gap: 10px;

}


.quantity button {

    width: 35px;

    height: 35px;

    border: none;

    border-radius: 7px;

    background: #ff6b00;

    color: white;

    font-size: 18px;

    cursor: pointer;

}


.quantity span {

    min-width: 25px;

    text-align: center;

    font-weight: bold;

}


/* =====================================
   REMOVE
===================================== */

.remove-btn {

    border: none;

    background: #e53935;

    color: white;

    padding: 9px;

    border-radius: 7px;

    cursor: pointer;

}


/* =====================================
   SUMMARY
===================================== */

.summary {

    background: white;

    padding: 20px;

    border-radius: 12px;

    margin-top: 20px;

}


.summary h2 {

    margin-top: 0;

}


.total {

    font-size: 24px;

    color: #ff6b00;

}


/* =====================================
   CUSTOMER DETAILS
===================================== */

.customer-details {

    background: white;

    padding: 20px;

    border-radius: 12px;

    margin-top: 20px;

}


.customer-details input {

    width: 100%;

    padding: 13px;

    margin-bottom: 12px;

    border: 1px solid #ddd;

    border-radius: 8px;

    font-size: 15px;

}


/* =====================================
   PLACE ORDER
===================================== */

#placeOrderBtn {

    width: 100%;

    margin-top: 20px;

    padding: 16px;

    border: none;

    border-radius: 10px;

    background: #ff6b00;

    color: white;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

}


#placeOrderBtn:disabled {

    opacity: 0.6;

    cursor: not-allowed;

}


/* =====================================
   EMPTY
===================================== */

.empty-cart {

    background: white;

    text-align: center;

    padding: 50px;

    border-radius: 12px;

}


@media(max-width:600px) {

    .cart-item {

        flex-wrap: wrap;

    }

}

</style>

</head>


<body>


<!-- =====================================
     HEADER
===================================== -->

<header class="header">

    <h1>
        🛒 Your Cart
    </h1>

    <button
        onclick="location.href='menu.html'"
    >
        ← Back to Menu
    </button>

</header>


<main class="container">


    <!-- CART -->

    <div id="cartItems">

        Loading cart...

    </div>


    <!-- SUMMARY -->

    <div class="summary">

        <h2>
            Order Summary
        </h2>

        <p>

            Total Items:
            <strong id="totalItems">
                0
            </strong>

        </p>


        <div class="total">

            Total:
            <strong id="cartTotal">
                ₹0
            </strong>

        </div>

    </div>


    <!-- CUSTOMER -->

    <div class="customer-details">

        <h2>
            Customer Details
        </h2>


        <input
            type="text"
            id="customerName"
            placeholder="Enter Customer Name"
        >


        <input
            type="text"
            id="tableNo"
            placeholder="Enter Table Number"
        >

    </div>


    <button
        id="placeOrderBtn"
    >

        🍽️ Place Order

    </button>


    <div
        id="orderMessage"
        style="
            text-align:center;
            margin-top:15px;
            font-weight:bold;
        "
    ></div>


</main>


<script
    type="module"
    src="../js/cart.js"
></script>


</body>

</html>

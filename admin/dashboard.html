<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sky House Admin Dashboard</title>

<link rel="stylesheet" href="../css/admin.css">

<link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    rel="stylesheet"
>

</head>

<body>

<div class="sidebar">

    <h2>☕ Sky House</h2>

    <ul>

        <li onclick="location.href='dashboard.html'">
            <i class="fas fa-home"></i>
            Dashboard
        </li>

        <li onclick="location.href='menu.html'">
            <i class="fas fa-utensils"></i>
            Menu
        </li>

        <li onclick="location.href='orders.html'">
            <i class="fas fa-shopping-cart"></i>
            Orders
        </li>

        <li onclick="location.href='booking.html'">
            <i class="fas fa-calendar"></i>
            Booking
        </li>

        <li onclick="location.href='reviews.html'">
            <i class="fas fa-star"></i>
            Reviews
        </li>

        <li onclick="location.href='settings.html'">
            <i class="fas fa-cog"></i>
            Settings
        </li>

    </ul>

</div>


<div class="main">

    <h1>Dashboard</h1>

  <button
    onclick="logout()"
    class="logout-btn"
>
    <i class="fas fa-sign-out-alt"></i>
    Logout
</button>  


    <!-- DASHBOARD CARDS -->

    <div class="cards">

        <div class="card">

            <h3>
                <i class="fas fa-shopping-cart"></i>
                Total Orders
            </h3>

            <h2 id="totalOrders">0</h2>

        </div>


        <div class="card">

            <h3>
                <i class="fas fa-indian-rupee-sign"></i>
                Total Sales
            </h3>

            <h2 id="totalSales">₹0</h2>

        </div>


        <div class="card">

            <h3>
                <i class="fas fa-clock"></i>
                Pending Orders
            </h3>

            <h2 id="pendingOrders">0</h2>

        </div>


        <div class="card">

            <h3>
                <i class="fas fa-circle-check"></i>
                Delivered Orders
            </h3>

            <h2 id="deliveredOrders">0</h2>

        </div>

    </div>
<div class="sales-section">

    <h2>📈 Sales Overview</h2>

    <div class="sales-chart">

        <canvas id="salesChart"></canvas>

    </div>

</div>

    <!-- RECENT ORDERS -->

    <h2 style="margin-top:40px;">
        Recent Orders
    </h2>

<div class="cards">

    <div class="card">
        <h3>🍕 Most Ordered Food</h3>
        <h2 id="topFood">-</h2>
    </div>

    <div class="card">
        <h3>📦 Total Items Sold</h3>
        <h2 id="totalItems">0</h2>
    </div>

</div>
    <table id="recentOrders">

        <thead>

            <tr>

                <th>Table</th>

                <th>Customer</th>

                <th>Items</th>

                <th>Status</th>

                <th>Total</th>

            </tr>

        </thead>


        <tbody>

        </tbody>

    </table>


</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script type="module" src="../js/dashboard.js"></script>

</body>

<script
    type="module"
    src="../js/admin-auth.js"
></script>

</html>

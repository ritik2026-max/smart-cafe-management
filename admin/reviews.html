<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reviews | Sky House Cafe</title>

    <link
        rel="stylesheet"
        href="../css/admin.css"
    >

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        rel="stylesheet"
    >

</head>

<body>


<div class="sidebar">

    <h2>☕ Sky House</h2>

    <ul>

        <li onclick="location.href='dashboard.html'">
            <i class="fas fa-home"></i>
            Dashboard
        </li>

        <li onclick="location.href='menu.html'">
            <i class="fas fa-utensils"></i>
            Menu
        </li>

        <li onclick="location.href='orders.html'">
            <i class="fas fa-shopping-cart"></i>
            Orders
        </li>

        <li onclick="location.href='booking.html'">
            <i class="fas fa-calendar"></i>
            Booking
        </li>

        <li class="active">
            <i class="fas fa-star"></i>
            Reviews
        </li>

        <li onclick="location.href='settings.html'">
            <i class="fas fa-cog"></i>
            Settings
        </li>

    </ul>

</div>


<div class="main">

    <div
        style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
            gap:15px;
        "
    >

        <div>

            <h1>⭐ Customer Reviews</h1>

            <p>
                Manage customer feedback
            </p>

        </div>


        <button
            onclick="logout()"
            class="logout-btn"
        >

            <i class="fas fa-sign-out-alt"></i>

            Logout

        </button>

    </div>



    <!-- FILTER -->

    <div
        style="
            margin:25px 0;
            display:flex;
            gap:10px;
            flex-wrap:wrap;
        "
    >

        <button
            class="review-filter active"
            data-status="all"
        >
            All
        </button>

        <button
            class="review-filter"
            data-status="Pending"
        >
            Pending
        </button>

        <button
            class="review-filter"
            data-status="Approved"
        >
            Approved
        </button>

        <button
            class="review-filter"
            data-status="Rejected"
        >
            Rejected
        </button>

    </div>



    <!-- SEARCH -->

    <input
        type="text"
        id="reviewSearch"
        placeholder="🔍 Search customer or review..."
        style="
            width:100%;
            max-width:500px;
            padding:12px;
            margin-bottom:20px;
            border:1px solid #ddd;
            border-radius:8px;
        "
    >



    <!-- REVIEWS -->

    <div
        style="
            width:100%;
            overflow-x:auto;
        "
    >

        <table id="reviewsTable">

            <thead>

                <tr>

                    <th>Customer</th>
                    <th>Rating</th>
                    <th>Review</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="reviewsBody">

                <tr>

                    <td
                        colspan="6"
                        style="
                            text-align:center;
                            padding:30px;
                        "
                    >

                        🔄 Loading Reviews...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<script
    type="module"
    src="../js/admin-reviews.js"
></script>


</body>

<script
    type="module"
    src="../js/admin-auth.js"
></script>

</html>

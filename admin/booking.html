<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bookings | Sky House Cafe</title>

    <link
        rel="stylesheet"
        href="../css/admin.css"
    >

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        rel="stylesheet"
    >

</head>

<body>


<!-- =========================================
     SIDEBAR
========================================= -->

<div class="sidebar">

    <h2>☕ Sky House</h2>

    <ul>

        <li onclick="location.href='dashboard.html'">
            <i class="fas fa-home"></i>
            Dashboard
        </li>


        <li onclick="location.href='menu.html'">
            <i class="fas fa-utensils"></i>
            Menu
        </li>


        <li onclick="location.href='orders.html'">
            <i class="fas fa-shopping-cart"></i>
            Orders
        </li>


        <li class="active">
            <i class="fas fa-calendar"></i>
            Booking
        </li>


        <li onclick="location.href='reviews.html'">
            <i class="fas fa-star"></i>
            Reviews
        </li>


        <li onclick="location.href='settings.html'">
            <i class="fas fa-cog"></i>
            Settings
        </li>

    </ul>

</div>



<!-- =========================================
     MAIN
========================================= -->

<div class="main">

    <div
        style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:15px;
            flex-wrap:wrap;
        "
    >

        <div>

            <h1>
                📅 Table Bookings
            </h1>

            <p>
                Manage customer table bookings
            </p>

        </div>


        <button
            onclick="logout()"
            class="logout-btn"
        >

            <i class="fas fa-sign-out-alt"></i>

            Logout

        </button>

    </div>



    <!-- =====================================
         FILTERS
    ====================================== -->

    <div
        style="
            margin:25px 0;
            display:flex;
            gap:10px;
            flex-wrap:wrap;
        "
    >

        <button
            class="booking-filter active"
            data-status="all"
        >
            All
        </button>


        <button
            class="booking-filter"
            data-status="Pending"
        >
            Pending
        </button>


        <button
            class="booking-filter"
            data-status="Confirmed"
        >
            Confirmed
        </button>


        <button
            class="booking-filter"
            data-status="Completed"
        >
            Completed
        </button>


        <button
            class="booking-filter"
            data-status="Cancelled"
        >
            Cancelled
        </button>

    </div>



    <!-- =====================================
         SEARCH
    ====================================== -->

    <input
        type="text"
        id="bookingSearch"
        placeholder="🔍 Search name, mobile, date..."
        style="
            width:100%;
            max-width:500px;
            padding:12px;
            margin-bottom:20px;
            border:1px solid #ddd;
            border-radius:8px;
        "
    >



    <!-- =====================================
         BOOKINGS TABLE
    ====================================== -->

    <div
        style="
            width:100%;
            overflow-x:auto;
        "
    >

        <table id="bookingsTable">

            <thead>

                <tr>

                    <th>Booking</th>

                    <th>Customer</th>

                    <th>Date</th>

                    <th>Time</th>

                    <th>Guests</th>

                    <th>Occasion</th>

                    <th>Request</th>

                    <th>Status</th>

                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="bookingsBody">

                <tr>

                    <td
                        colspan="9"
                        style="
                            text-align:center;
                            padding:30px;
                        "
                    >

                        🔄 Loading Bookings...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>



<script
    type="module"
    src="../js/admin-booking.js"
></script>


</body>

<script
    type="module"
    src="../js/admin-auth.js"
></script>


</html>

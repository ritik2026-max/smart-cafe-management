<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Orders | Sky House Admin</title>

    <link
        rel="stylesheet"
        href="../css/admin.css"
    >

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        rel="stylesheet"
    >

</head>


<body>


<!-- =========================
     SIDEBAR
========================= -->

<div class="sidebar">

    <h2>☕ Sky House</h2>

    <ul>

        <li onclick="location.href='dashboard.html'">
            <i class="fas fa-home"></i>
            Dashboard
        </li>

        <li onclick="location.href='menu.html'">
            <i class="fas fa-utensils"></i>
            Menu
        </li>

        <li class="active">

            <i class="fas fa-shopping-cart"></i>

            Orders

        </li>

        <li onclick="location.href='booking.html'">

            <i class="fas fa-calendar"></i>

            Booking

        </li>

        <li onclick="location.href='reviews.html'">

            <i class="fas fa-star"></i>

            Reviews

        </li>

        <li onclick="location.href='settings.html'">

            <i class="fas fa-cog"></i>

            Settings

        </li>

    </ul>

</div>



<!-- =========================
     MAIN
========================= -->

<div class="main">


    <div
        style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:15px;
            flex-wrap:wrap;
        "
    >

        <div>

            <h1>
                🛒 Orders
            </h1>

            <p>
                Manage customer orders
            </p>

        </div>


        <button
            onclick="loadOrders()"
            class="logout-btn"
            style="background:#ff6b00;"
        >

            <i class="fas fa-sync-alt"></i>

            Refresh

        </button>

    </div>



    <!-- =========================
         ORDER STATS
    ========================= -->

    <div class="cards">


        <div class="card">

            <h3>
                📦 Total Orders
            </h3>

            <h2 id="totalOrders">
                0
            </h2>

        </div>


        <div class="card">

            <h3>
                🟡 Pending
            </h3>

            <h2 id="pendingOrders">
                0
            </h2>

        </div>


        <div class="card">

            <h3>
                👨‍🍳 Preparing
            </h3>

            <h2 id="preparingOrders">
                0
            </h2>

        </div>


        <div class="card">

            <h3>
                ✅ Completed
            </h3>

            <h2 id="completedOrders">
                0
            </h2>

        </div>


        <div class="card">

            <h3>
                💰 Sales
            </h3>

            <h2 id="totalSales">
                ₹0
            </h2>

        </div>


    </div>



    <!-- =========================
         FILTER
    ========================= -->

    <div
        style="
            margin:30px 0 20px;
            display:flex;
            gap:10px;
            flex-wrap:wrap;
        "
    >

        <button
            class="filter-btn active"
            onclick="filterOrders('All')"
        >
            All
        </button>


        <button
            class="filter-btn"
            onclick="filterOrders('Pending')"
        >
            🟡 Pending
        </button>


        <button
            class="filter-btn"
            onclick="filterOrders('Preparing')"
        >
            👨‍🍳 Preparing
        </button>


        <button
            class="filter-btn"
            onclick="filterOrders('Completed')"
        >
            ✅ Completed
        </button>


        <button
            class="filter-btn"
            onclick="filterOrders('Cancelled')"
        >
            ❌ Cancelled
        </button>

    </div>



    <!-- =========================
         ORDERS TABLE
    ========================= -->

    <div
        style="
            overflow-x:auto;
            background:white;
            border-radius:12px;
            box-shadow:0 4px 15px rgba(0,0,0,.08);
        "
    >

        <table id="ordersTable">

            <thead>

                <tr>

                    <th>
                        Order
                    </th>

                    <th>
                        Time
                    </th>

                    <th>
                        Customer
                    </th>

                    <th>
                        Table
                    </th>

                    <th>
                        Items
                    </th>

                    <th>
                        Total
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>


            <tbody id="ordersBody">

                <tr>

                    <td
                        colspan="8"
                        style="text-align:center;padding:30px;"
                    >

                        🔄 Loading Orders...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>


</div>



<!-- =========================
     ORDER DETAILS MODAL
========================= -->

<div
    id="orderModal"
    style="
        display:none;
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.6);
        z-index:9999;
        align-items:center;
        justify-content:center;
        padding:20px;
    "
>

    <div
        style="
            background:white;
            width:100%;
            max-width:550px;
            max-height:90vh;
            overflow-y:auto;
            border-radius:15px;
            padding:25px;
            position:relative;
        "
    >

        <button
            onclick="closeOrderModal()"
            style="
                position:absolute;
                right:15px;
                top:15px;
                border:none;
                background:#eee;
                width:35px;
                height:35px;
                border-radius:50%;
                cursor:pointer;
            "
        >
            ✕
        </button>


        <h2>
            🧾 Order Details
        </h2>


        <div id="orderDetails">

        </div>

    </div>

</div>



<script type="module">

    import "../js/admin-orders.js";

</script>


</body>

</html>
